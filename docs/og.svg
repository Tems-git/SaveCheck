<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#EDF1EC"/>
    <stop offset="100%" stop-color="#E4EAE4"/>
  </linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0C2A1B"/>
    <stop offset="58%" stop-color="#12492C"/>
    <stop offset="100%" stop-color="#16653B"/>
  </linearGradient>
  <linearGradient id="card-g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#F8FAF8"/>
  </linearGradient>
  <linearGradient id="r365" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4ADE80"/>
    <stop offset="1" stop-color="#16A34A"/>
  </linearGradient>
</defs>

<!-- Background -->
<rect width="1200" height="630" fill="url(#bg)"/>

<!-- Left: hero panel -->
<rect x="52" y="52" width="560" height="526" rx="28" fill="url(#hero)"/>

<!-- Logo mark (same geometry as docs/img/logos/logo.svg, scaled to 52px) -->
<g transform="translate(92 92) scale(0.173333)">
  <rect width="300" height="300" rx="90" fill="url(#r365)"/>
  <g transform="translate(150 150)" fill="none" stroke="#06301C"
     stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-16" cy="-16" r="78"/>
    <path d="M42 42L104 104"/>
    <path d="M-50 -12l30 30 52-58"/>
  </g>
</g>

<!-- Brand name -->
<text x="158" y="126" font-family="-apple-system,system-ui,sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5" fill="white">Real<tspan fill="#7BEBAC">365</tspan></text>

<!-- Tagline -->
<text x="92" y="183" font-family="-apple-system,system-ui,sans-serif" font-size="18" fill="rgba(214,240,224,.88)" font-weight="500">Реална ли е промоцията?</text>

<!-- Divider -->
<rect x="92" y="207" width="480" height="1.5" fill="rgba(255,255,255,.15)" rx="1"/>

