<text x="92" y="358" font-family="-apple-system,system-ui,sans-serif" font-size="15" fill="rgba(255,255,255,.92)">✓  Реално намаление vs. фалшива промоция</text>
<text x="92" y="391" font-family="-apple-system,system-ui,sans-serif" font-size="15" fill="rgba(255,255,255,.92)">✓  90-дневна графика на всяка цена</text>
<text x="92" y="424" font-family="-apple-system,system-ui,sans-serif" font-size="15" fill="rgba(255,255,255,.92)">✓  Седмични брошури с верификация</text>
<text x="92" y="457" font-family="-apple-system,system-ui,sans-serif" font-size="15" fill="rgba(255,255,255,.92)">✓  Битката на Титаните — класация на вериги</text>

<!-- URL -->
<rect x="92" y="506" width="480" height="48" rx="12" fill="rgba(255,255,255,.12)"/>
<text x="332" y="536" font-family="-apple-system,system-ui,sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">real365.store</text>

