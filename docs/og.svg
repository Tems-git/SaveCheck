<text x="92" y="255" font-family="-apple-system,system-ui,sans-serif" font-size="64" font-weight="800" fill="white" letter-spacing="-2">90</text>
<text x="177" y="241" font-family="-apple-system,system-ui,sans-serif" font-size="16" fill="rgba(214,240,224,.78)">дни история</text>
<text x="177" y="263" font-family="-apple-system,system-ui,sans-serif" font-size="16" fill="rgba(214,240,224,.78)">на цената</text>

<text x="290" y="255" font-family="-apple-system,system-ui,sans-serif" font-size="64" font-weight="800" fill="white" letter-spacing="-2">5</text>
<text x="330" y="241" font-family="-apple-system,system-ui,sans-serif" font-size="16" fill="rgba(214,240,224,.78)">търговски</text>
<text x="330" y="263" font-family="-apple-system,system-ui,sans-serif" font-size="16" fill="rgba(214,240,224,.78)">вериги</text>

<text x="430" y="255" font-family="-apple-system,system-ui,sans-serif" font-size="64" font-weight="800" fill="white" letter-spacing="-2">5700</text>
<text x="560" y="241" font-family="-apple-system,system-ui,sans-serif" font-size="14" fill="rgba(214,240,224,.78)">следени</text>
<text x="560" y="260" font-family="-apple-system,system-ui,sans-serif" font-size="14" fill="rgba(214,240,224,.78)">оферти</text>

<!-- Divider 2 -->
<rect x="92" y="285" width="480" height="1.5" fill="rgba(255,255,255,.15)" rx="1"/>

<!-- Features list -->
