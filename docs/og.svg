<text x="740" y="540" font-family="-apple-system,system-ui,sans-serif" font-size="13" fill="#6B7F72">Цената е в рамките на нормалното</text>
<text x="1100" y="502" font-family="-apple-system,system-ui,sans-serif" font-size="26" font-weight="800" fill="#9C6B06" text-anchor="end">3,57 €</text>
<text x="1100" y="528" font-family="-apple-system,system-ui,sans-serif" font-size="13" fill="#6B7F72" text-anchor="end">медиана 3,68 €</text>

<!-- Data source note -->
<text x="600" y="612" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="#6B7F72" text-anchor="middle">Данни: КЗП kolkostruva.bg · Обновява се всеки ден · Отворен код</text>
