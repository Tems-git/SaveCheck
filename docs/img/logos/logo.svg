<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="Real365">
  <title>Real365</title>
  <defs>
    <!-- 140deg in the prototype's CSS; the diagonal is the closest
         faithful equivalent in SVG's unit square. -->
    <linearGradient id="r365" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
  </defs>

  <rect width="300" height="300" rx="90" fill="url(#r365)"/>

  <!-- Magnifier + check, drawn from the square's centre. -->
  <g transform="translate(150 150)" fill="none" stroke="#06301C"
     stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-16" cy="-16" r="78"/>
    <path d="M42 42L104 104"/>
    <path d="M-50 -12l30 30 52-58"/>
  </g>
</svg>
